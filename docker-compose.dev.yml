services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: nestjs_bun_api_dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD}@db:5432/acturusdigital_db
      SUPABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run --hot src/main.ts

  db:
    image: postgres:16-alpine
    container_name: supabase_postgres_dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supabase_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d supabase_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
